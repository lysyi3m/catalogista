# Catalogista — XcodeGen project spec. Regenerate with `make generate`.
# A multiplatform SwiftUI app over the CatalogistaKit framework and the local DiscogsKit package.

name: Catalogista

options:
  bundleIdPrefix: com.mlkshkvch.catalogista
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

packages:
  DiscogsKit:
    path: DiscogsKit

targets:
  # Everything but the @main entry point: SwiftData cache, services, and the SwiftUI feature layer.
  # Keeping the views here too means only AppServices and the root view need to be public, and the
  # tests can run unhosted — no app launch, no sandbox, no signing.
  CatalogistaKit:
    type: framework
    supportedDestinations: [macOS, iOS]
    sources:
      - Sources/Kit
      # UserDefaults is a required-reason API and the calls live in this framework, so its bundle
      # carries the declaration. The app bundle gets the same file; Apple scans both.
      - Config/PrivacyInfo.xcprivacy
    dependencies:
      - package: DiscogsKit
        product: DiscogsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlkshkvch.catalogista.kit
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  Catalogista:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - Sources/App
      - Config/PrivacyInfo.xcprivacy
    dependencies:
      - target: CatalogistaKit
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Catalogista
        CFBundleName: Catalogista
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "© 2026 Emil Kashkevich · MIT License"
        ITSAppUsesNonExemptEncryption: false
        # Required by the Mac App Store; iOS takes its category from App Store Connect.
        LSApplicationCategoryType: public.app-category.music
        # A copy dragged from the grid or list onto a sidebar folder (`CopyReference`).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.mlkshkvch.catalogista.copy
            UTTypeDescription: Catalogista Copy
            UTTypeConformsTo: [public.data]
        UILaunchScreen: {}
        # Ignored on macOS. Without these an iOS Release build warns, and the app would inherit
        # whatever the toolchain defaults to rather than what it was designed for.
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Config/Catalogista.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Discogs API and the image CDN.
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlkshkvch.catalogista
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        ENABLE_HARDENED_RUNTIME: YES
        # XcodeGen emits only the iOS rpath for a multiplatform target, but a macOS executable sits
        # in Contents/MacOS, one level below the embedded frameworks. Without the macOS variant the
        # app launches straight into a dyld "Library not loaded: @rpath/CatalogistaKit.framework"
        # abort.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]: "$(inherited) @executable_path/../Frameworks"
        TARGETED_DEVICE_FAMILY: "1,2"
        # iOS needs application-identifier and keychain-access-groups for the Keychain, and macOS
        # rejects application-identifier outright, so the two platforms take different files.
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Config/Catalogista-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Config/Catalogista-iOS.entitlements

  # Not app-hosted: the runner is unsandboxed and needs no signing, which matters for the
  # Keychain-backed token store.
  CatalogistaTests:
    type: bundle.unit-test
    supportedDestinations: [macOS, iOS]
    sources:
      - Tests
    dependencies:
      - target: CatalogistaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlkshkvch.catalogista.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Catalogista:
    build:
      targets:
        CatalogistaKit: all
        Catalogista: [run, profile, archive, analyze]
        CatalogistaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CatalogistaTests
    archive:
      config: Release
